version: "3.9"

services:

  telegram-bot-api:
    restart: unless-stopped
    image: evilfreelancer/docker-telegram-bot-api:deploy
    build:
      context: .
    environment:
      TELEGRAM_STAT: "true"
      TELEGRAM_LOCAL: "true"
      TELEGRAM_API_ID: "24698381"
      TELEGRAM_API_HASH: "05cfb4e7d3429376b20a4742c6786642"
    volumes:
      - ./telegram-bot-api_data:/var/lib/telegram-bot-api
    ports:
      - "127.0.0.1:8081:8081"
      - "127.0.0.1:8082:8082"
    logging:
      driver: "json-file"
      options:
        max-size: "50k"
